server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mobiledoc?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${MOBILEDOC_DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 console (MySQL ?? ?)
spring.h2.console.enabled=false

# =====================
# Mail (SMTP) - Gmail
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MOBILEDOC_MAIL_USERNAME}
spring.mail.password=${MOBILEDOC_MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ?? from
app.mail.from=MobileDoc <no-reply@mobiledoc.local>

# Gmail
app.mail.gmail.host=smtp.gmail.com
app.mail.gmail.port=587
app.mail.gmail.username=${MOBILEDOC_GMAIL_USERNAME:}
app.mail.gmail.password=${MOBILEDOC_GMAIL_APP_PASSWORD:}
app.mail.gmail.from=MobileDoc <${MOBILEDOC_GMAIL_USERNAME:no-reply@mobiledoc.local}>

# Naver
app.mail.naver.host=smtp.naver.com
app.mail.naver.port=587
app.mail.naver.username=${MOBILEDOC_NAVER_USERNAME:}
app.mail.naver.password=${MOBILEDOC_NAVER_PASSWORD:}
app.mail.naver.from=MobileDoc <${MOBILEDOC_NAVER_USERNAME:no-reply@mobiledoc.local}>

# ??? ???
app.mail.admin=${MOBILEDOC_ADMIN_EMAIL:your_admin_email@domain.com}

# ? properties ???? ?? (YAML ??)
app.alert.adminEmail=${MOBILEDOC_ADMIN_EMAIL:your_admin_email@domain.com}
